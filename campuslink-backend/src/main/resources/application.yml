spring:
  application:
    name: campuslink-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ===================== MySQL (défaut local — WampServer) =====================
  # Base à créer une fois : CREATE DATABASE campuslink_db CHARACTER SET utf8mb4;
  # puis initialiser : mysql -u root < database/schema.sql
  # PostgreSQL reste possible en surcharge (Docker/Render) via DB_URL + DB_DRIVER.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campuslink_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&nullCatalogMeansCurrent=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      pool-name: CampusLinkHikariPool

  # ===================== JPA / Hibernate =====================
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Pas de dialecte forcé : Hibernate le détecte depuis l'URL JDBC
        # (MySQL en local, PostgreSQL via Docker/Render, H2 en tests).
        jdbc:
          time_zone: UTC

  # ===================== Spring Mail =====================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ===================== Upload fichiers =====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

# ===================== JWT =====================
application:
  jwt:
    # Pas de valeur par défaut ici : le secret de développement (public, dans
    # le repo) est fourni par application-dev.yml, et la production exige
    # JWT_SECRET (application-prod.yml). Une application lancée sans secret
    # échoue au démarrage plutôt que de retomber sur un secret dev connu de
    # tous (signalé comme "sensitive data exposure" par les scanners).
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 jours
    issuer: campuslink-backend

  # ===================== Cloudinary =====================
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  # ===================== Média (upload / compression) =====================
  media:
    folder: ${MEDIA_FOLDER:campuslink}
    # Stockage local de repli quand application.cloudinary.* est vide (dev,
    # démo, CI) : les fichiers sont écrits ici et servis via /media/files/**.
    local-dir: ${MEDIA_LOCAL_DIR:uploads}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
    allowed-content-types: ${MEDIA_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    quality: ${MEDIA_IMAGE_QUALITY:auto:good}
    max-dimension: ${MEDIA_MAX_DIMENSION:1080}

  # ===================== Envoi d'emails =====================
  mail:
    # Mode « log-only » : aucun envoi SMTP, le destinataire et le sujet sont
    # journalisés (corps en DEBUG) au lieu de lever EmailDeliveryException (503).
    # - dev  : activé dans application-dev.yml (aucun SMTP en local, ce qui
    #   bloquait /otp/send et /auth/forgot-password — et donc la vérification
    #   d'email et la réinitialisation de mot de passe côté front).
    # - prod : false par défaut ; ne jamais activer : les utilisateurs
    #   n'enverraient jamais d'email et l'OTP / reset deviendrait inutilisable.
    log-only: ${MAIL_LOG_ONLY:false}

  # ===================== OTP =====================
  otp:
    length: ${OTP_LENGTH:6}
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # Toutes les 15 minutes par défaut.
    cleanup-cron: ${OTP_CLEANUP_CRON:0 */15 * * * *}

  # ===================== Forgot Password =====================
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    resend-cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 */15 * * * *}

  # ===================== CORS =====================
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://127.0.0.1:5173}

# ===================== Seed administrateur (déploiement) =====================
# Compte ADMIN créé au démarrage si les deux variables sont renseignées
# (voir AdminSeedRunner — no-op en local/tests). Une fois le compte créé,
# retirer les variables pour ne plus ré-exécuter le seed.
campuslink:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

# ===================== Swagger / OpenAPI =====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# ===================== Actuator (healthcheck) =====================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Indicateur SMTP : sans credentials valide, il fait passer toute la
      # santé à DOWN alors que l'application fonctionne — le healthcheck
      # Docker/Render marquerait alors le service comme unhealthy.
      # - prod : actif par défaut (MAIL_USERNAME/MAIL_PASSWORD renseignés)
      # - dev  : désactivé dans application-dev.yml (pas de SMTP en local)
      # - surcharge : MAIL_HEALTH_ENABLED=true|false
      enabled: ${MAIL_HEALTH_ENABLED:true}

# ===================== Logging =====================
logging:
  level:
    root: INFO
    com.campuslink: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
